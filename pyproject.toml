[project]
name = "memecoin-bot"
version = "0.1.0"
description = "Robinhood Chain memecoin monitoring bot (paper trading only)"
requires-python = ">=3.10"
dependencies = ["web3>=7.0,<9", "rich>=13.7", "python-dotenv>=1.0"]

[project.scripts]
memecoin-bot = "memecoin_bot.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
